<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ergenen.com – KI-Zentrale im Aufbau</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' stroke='%2300ffe5' stroke-width='5' fill='none'/><path d='M35,50 L65,50 M50,35 L50,65' stroke='%2300ffe5' stroke-width='5' stroke-linecap='round'/></svg>" />
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #e0f7fa; text-align: center; padding: 2rem; }
    .language-switcher { position: absolute; top: 1rem; right: 1rem; }
    .logo-animated { width: 120px; animation: pulse 2.5s infinite; margin: 2rem auto; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    .progress-bar { width: 60%; margin: 1rem auto; height: 20px; background: #444; border-radius: 10px; }
    .progress { width: 60%; height: 100%; background: #00ffe5; animation: pulse 3s ease-in-out infinite; }
    .spinner { margin: 2rem auto; width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #00ffe5; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    function switchLanguage(lang) {
      document.cookie = "language=" + lang + ";path=/;max-age=31536000";
      document.getElementById('content-de').style.display = lang === 'de' ? 'block' : 'none';
      document.getElementById('content-en').style.display = lang === 'en' ? 'block' : 'none';
    }
    function getLanguageFromCookie() {
      const match = document.cookie.match(/(?:^|; )language=([^;]*)/);
      return match ? decodeURIComponent(match[1]) : 'de';
    }
    window.onload = function () { switchLanguage(getLanguageFromCookie()); };
  </script>
</head>
<body>
  <div class="language-switcher">
    <button onclick="switchLanguage('de')">Deutsch</button>
    <button onclick="switchLanguage('en')">English</button>
  </div>
  <svg class="logo-animated" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" stroke="#00ffe5" stroke-width="5" fill="none" />
    <path d="M35,50 L65,50 M50,35 L50,65" stroke="#00ffe5" stroke-width="5" stroke-linecap="round" />
  </svg>
  <div id="content-de">
    <h1>ergenen.com</h1>
    <p>Diese futuristische Kommandozentrale für <strong>künstliche Intelligenz</strong> befindet sich im Aufbau.</p>
    <div class="progress-bar"><div class="progress"></div></div>
    <div class="spinner"></div>
  </div>
  <div id="content-en" style="display:none;">
    <h1>ergenen.com</h1>
    <p>This futuristic control center for <strong>artificial intelligence</strong> is currently under construction.</p>
    <div class="progress-bar"><div class="progress"></div></div>
    <div class="spinner"></div>
  </div>
</body>
</html>
